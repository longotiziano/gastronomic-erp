{% extends 'partials/general_form.html' %}

{% block form_content %}
<div class="form-group">
    <label for="name">Nombre del producto:</label>
    <input type="text" id="name" name="name" required>
</div>

<div class="form-group">
    <label for="category_id">Categoría:</label>
    <select id="category_id" name="category_id" required>
        {% for category in categories or [] %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="bar_id">Bar:</label>
    <select id="bar_id" name="bar_id" required>
        {% for bar in bars or [] %}
        <option value="{{ bar.id }}">{{ bar.name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="price">Precio:</label>
    <input type="number" id="price" name="price" min="0" step="0.01" required>
</div>

<div class="form-group">
    <button type="button" class="btn-edit btn-icon" style="margin: 0.2rem 0;" id="toggle-recipe-form">Ver receta</button>
</div>

<div id="recipe-form-section" class="block border" style="display: none;">
    <table class="dishes-table">
        <thead>
            <tr>
                <th>Materia prima</th>
                <th>Cantidad</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="recipe-rows"></tbody>
    </table>
    <div class="block-footer mini">
        <button type="button" class="btn-edit btn-icon" id="add-recipe-btn" style="margin-top: 0.5rem;">
            + Agregar ingrediente
        </button>
    </div>
</div>

<template id="recipe-row-template">
    <tr class="recipe-row">
        <td>
            <div class="form-group">
                <select name="recipe_raw_material_id[]">
                    {% for raw_material in raw_materials or [] %}
                    <option value="{{ raw_material.id }}" data-uom="{{ raw_material.uom.value }}">
                        {{ raw_material.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>  
        </td>
        <td>
            <div class="form-group recipe-amount-wrapper">
                <input type="number" name="recipe_amount[]" class="recipe-amount-input" min="0.01" step="0.01" required>
                <span class="recipe-uom">gr</span>
            </div>
        </td>
        <td>
            <button type="button" class="btn-icon btn-edit remove-recipe-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </td>
    </tr>
</template>
{% endblock %}
