<nav class="navbar">
    <a class="logo-link" href="{{ url_for('main.index') }}">
        <img src="{{ url_for('static', filename='img/logo-club-serrano.png') }}">
    </a>
    <ul>
        {% if is_logged or is_admin %}
        <li><a href="{{ url_for('sales.render_sales') }}">Ventas</a></li>
        <li><a href="">Stock</a></li>
        <li><a href="">Empleados</a></li>
        <li><a href="">Carta</a></li>
        <li><a href="">Arqueos de Caja</a></li>
        {% if bar_selection and is_admin %}
        <li>
            <div class="dropdown-wrapper">
                <button type="button" class="btn-edit btn-icon fire-desplegable">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-store-icon lucide-store"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></svg>                </button>
                <div class="block relative-block">
                    <div class="block-header">
                        <h3>Selección de bar</h3>
                    </div>
                    <form action="{{ url_for('main.bar_select') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="next" value="{{ request.path }}">
                        <div class="block-content">
                            <div class="form-group">
                                <label for="bar_id">Bar</label>
                                <select name="bar_id" required>
                                    {% for name, id in bar_selection.items() %}
                                        <option value="{{ id }}"
                                            {% if selected_bar_id == id %}selected{% endif %}>
                                            {{ name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="block-footer" style="padding: 0.5rem;">
                            <button type="submit" class="btn-icon btn-edit" style="padding: 0.3rem;">Aplicar</button>
                        </div>  
                    </form>
                </div>
            </div>
        </li>
        {% endif %}
        <button class="config-btn" id="configBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-bolt-icon lucide-bolt">
                <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                <circle cx="12" cy="12" r="4" />
            </svg>
        </button>
        {% endif %}
        {% if not (is_logged or is_admin) %}
        <li><a href="{{ url_for('auth.login') }}">Iniciar sesión</a></li>
        {% endif %}
    </ul>
</nav>
