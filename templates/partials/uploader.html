{% macro render_uploader(uploader_id, action, label="Cargar datos", extra_fields={}) %}
<form method="POST" action="{{ action }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="block">
        <div class="block-header center">
            <h3>{{ label }}</h3>
        </div>

        <div class="block-content" style="gap: 0;">
            <div class="btn-icon btn-edit upload-dropzone" data-uploaderid="{{ uploader_id }}">
                <input type="file" name="file" id="{{ uploader_id }}" hidden>

                <label for="{{ uploader_id }}" class="upload-trigger">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/></svg>
                </label>

                <div class="upload-file-selected">
                    <span class="file-name"></span>
                    <button type="button" class="x-btn" aria-label="Quitar archivo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-edit btn-icon uploader">Subir archivo</button>
        </div>
    </div>
</form>
{% endmacro %}
